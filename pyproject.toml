[project]
name = "vernier"
version = "0.1.0"
description = "Measure meaning by perturbing text and watching a calibrated probability move."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
vernier = "vernier.cli:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
