[project]
name = "vernier-scale"
version = "0.1.1"
description = "Measure meaning by perturbing text and watching a calibrated probability move."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["typesafe", "jev", "ablation", "attribution", "interpretability", "nlp"]
authors = [{ name = "n0nuser", email = "n0nuser@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/n0nuser/vernier"
Repository = "https://github.com/n0nuser/vernier"
Issues = "https://github.com/n0nuser/vernier/issues"

[project.scripts]
vernier = "vernier_scale.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.16.8",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "PL", "RUF", "D", "BLE", "ANN"]
# D1xx: the gate enforces docstring format, never presence. A docstring is
# written where it adds what the code cannot say, not on everything.
# PLR2004 fires on structural minimums such as `if len(levels) < 2`, where the
# literal states the rule more clearly than a name for it would. The thresholds
# that genuinely needed naming carry names (HAZE_FLAT, ONE_HOT_TOLERANCE,
# STEADY_BASELINE_REPLICATES, MIN_BASELINE_REPLICATES).
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "PLR0913", "PLR2004",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
